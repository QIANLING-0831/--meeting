<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qwen Realtime Interview Copilot</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/enhancements.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">QWEN DUAL-MODE REALTIME</span><h1>Interview Copilot</h1></div>
    <div class="status-row"><span id="aliyunStatus" class="pill">阿里云检查中</span><button id="aliyunKeyButton" class="ghost">配置 API Key</button></div>
  </header>
  <main>
    <section class="setup card">
      <div class="section-title"><div><span class="step">01</span><h2>面试资料</h2></div><span id="sessionBadge" class="muted">尚未准备</span></div>
      <div class="two-col"><label>公司<input id="company" placeholder="例如：某科技公司"></label><label>岗位<input id="position" placeholder="例如：Agent 应用开发"></label></div>
      <label>岗位 JD<textarea id="jd" rows="5" placeholder="粘贴本次岗位描述"></textarea></label>
      <label class="file-label">简历（PDF / MD / TXT）<input id="resume" type="file" accept=".pdf,.md,.txt"></label>
      <button id="prepareButton" class="primary wide">生成本次面试工作区</button>
      <label id="factsWrap" class="hidden">候选人事实与项目描述（请核对、补充后保存）<textarea id="facts" rows="9"></textarea></label>
      <button id="saveFactsButton" class="secondary wide hidden">保存候选人事实</button>
    </section>

    <section class="live card">
      <div class="section-title"><div><span class="step">02</span><h2>实时会话</h2></div><span id="liveBadge" class="live-dot">未开始</span></div>
      <div class="controls">
        <label class="device-control">系统声音<select id="loopbackDevice" class="loopback-device"></select></label>
        <button id="scanDevicesButton" class="secondary compact">检测会议声音</button>
        <button id="startButton" class="primary">开始</button><button id="stopButton" class="danger" disabled>停止</button>
      </div>
      <div class="audio-levels"><label>系统声 <meter id="interviewerLevel" min="0" max="1" value="0"></meter><span id="interviewerLevelText">未检测</span></label></div>
      <div id="transcript" class="transcript"><div class="empty">Qwen 会直接转写面试官的系统声音。</div></div>
      <p class="hint">关闭最后一个浏览器页面后，录音与 Qwen 连接会自动停止。</p>
    </section>

    <section class="answer card">
      <div class="section-title"><div><span class="step">03</span><h2>Qwen 回答</h2></div><span id="answerState" class="muted">等待音频</span></div>
      <div class="realtime-controls">
        <label>处理模式<select id="pipelineMode"><option value="dual">双模型（推荐：专用 ASR → 回答）</option><option value="realtime">单模型（Audio Realtime）</option></select></label>
        <label>回答模型<select id="answerModel"><option value="qwen-plus">Qwen Plus（推荐）</option><option value="qwen-flash">Qwen Flash（更快）</option></select></label>
        <label>单模型备用<select id="realtimeModel"><option value="qwen-audio-3.0-realtime-plus">Qwen Audio Realtime Plus</option><option value="qwen-audio-3.0-realtime-flash">Qwen Audio Realtime Flash</option></select></label>
        <label>单模型轮次检测<select id="turnDetection"><option value="server_vad">Server VAD</option><option value="smart_turn">Smart Turn</option></select></label>
        <label>百炼业务空间 ID（推荐）<input id="workspaceId" placeholder="留空使用兼容域名"></label>
        <button id="saveRealtimeButton" class="secondary compact">保存设置</button>
      </div>
      <div id="questionBox" class="question-box">识别到完整问题后会显示在这里。</div>
      <article id="answerOutput" class="answer-output"><div class="empty">系统音频先由专用 Qwen ASR 转写，再由 Qwen Plus 流式回答。</div></article>
    </section>
  </main>

  <dialog id="aliyunKeyDialog">
    <form id="aliyunKeyForm">
      <div class="dialog-head"><h2>阿里云百炼 API Key</h2><button id="aliyunKeyCancel" type="button" class="ghost compact">取消</button></div>
      <p id="aliyunKeyHint" class="hint">完整 Key 不会在页面中回显。</p>
      <label>输入 API Key<input id="aliyunKey" type="password" autocomplete="new-password" required minlength="8"></label>
      <label>再次确认<input id="aliyunKeyConfirm" type="password" autocomplete="new-password" required minlength="8"></label>
      <button type="submit" class="primary wide">保存到本机</button>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script src="/static/app.js"></script>
</body>
</html>
